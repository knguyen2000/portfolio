name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug
      description: One-sentence description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual
      description: What should happen and what actually happens
      value: |
        - Expected:
        - Actual:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Environment, agent mode, relevant config, screenshots
    validations:
      required: false
